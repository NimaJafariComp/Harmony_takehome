{% extends "base.html" %}

{% block title %}Local Review · {{ error_title }}{% endblock %}

{% block content %}
  <section class="error-state" aria-labelledby="error-title">
    <div class="trace" aria-hidden="true"></div>
    <div>
      <p class="section-label">Read-only review</p>
      <h1 id="error-title">{{ error_title }}</h1>
      <p class="lede">{{ error_message }}</p>
      <a class="text-link" href="/">Return to the review queue</a>
    </div>
  </section>
{% endblock %}
