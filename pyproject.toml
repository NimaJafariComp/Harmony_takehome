[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/enterprise_agent"]

[project]
name = "enterprise-agent-harness"
version = "0.1.0"
description = "A safe, durable enterprise agent harness."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic>=1.14,<2",
  "pydantic>=2.10,<3",
  "psycopg[binary]>=3.2,<4",
  "rich>=15,<16",
  "sqlalchemy>=2.0,<3",
  "typer>=0.15,<1",
]

[dependency-groups]
dev = [
  "mypy>=1.13,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<2",
  "pytest-cov>=6,<7",
  "ruff>=0.8,<1",
]

[project.scripts]
enterprise-agent = "enterprise_agent.cli:main"

[tool.pytest.ini_options]
addopts = ["-ra", "--strict-config", "--strict-markers"]
asyncio_mode = "auto"
markers = [
  "contract: external-command or configuration contract",
  "critical: focused safety regression required after behavior-changing tasks",
  "integration: integration test requiring a real service boundary",
  "scenario: deterministic business-story regression using fixed-time fixtures",
  "unit: fast isolated behavior test",
]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["enterprise_agent"]

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
files = ["src", "tests"]
python_version = "3.12"
strict = true
