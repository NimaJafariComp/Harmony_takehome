[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/enterprise_agent"]

[project]
name = "enterprise-agent-harness"
version = "0.1.0"
description = "A safe, durable enterprise agent harness."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "typer>=0.15,<1",
]

[dependency-groups]
dev = [
  "mypy>=1.13,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.8,<1",
]

[project.scripts]
enterprise-agent = "enterprise_agent.cli:main"

[tool.pytest.ini_options]
addopts = ["-ra", "--strict-config", "--strict-markers"]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["enterprise_agent"]

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
files = ["src", "tests"]
python_version = "3.12"
strict = true
